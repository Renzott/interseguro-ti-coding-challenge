name: interseguro-tunnels

services:
  tunnel-fiber:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-fiber-tunnel
    command: tunnel --no-autoupdate --url http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tunnel-astro:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-astro-tunnel
    command: tunnel --no-autoupdate --url http://host.docker.internal:4321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
